name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod npm pack
          npm install
          hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public/en

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The Spanish and Japanese sites are deployed from mirror repos with their
  # own domains. Trigger them so all three stay in sync with this commit.
  trigger-mirrors:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      fail-fast: false
      matrix:
        repo: [personal-website-es, personal-website-ja]
    steps:
      - name: Trigger mirror deploy
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MIRROR_DISPATCH_TOKEN secret is not set"
            exit 1
          fi
          gh api --method POST \
            "repos/ariostas/${{ matrix.repo }}/actions/workflows/hugo.yml/dispatches" \
            -f ref=main -f "inputs[ref]=${{ github.sha }}"
